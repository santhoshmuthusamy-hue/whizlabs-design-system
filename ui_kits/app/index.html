<div id="root"></div>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="ExamPlayer.jsx"></script>
<script type="text/babel" src="ResultsView.jsx"></script>
<script type="text/babel">
/* DS bundle guard */
if(!window.WhizlabsDesignSystem_c8ccaf){document.getElementById('root').innerHTML='<p style="font:14px/1.5 system-ui;padding:24px;color:#b23616">Design system bundle not loaded — _ds_bundle.js is generated by the compiler. Open this page from the project so <code>../../_ds_bundle.js</code> resolves.</p>';throw new Error('_ds_bundle.js missing');}
const { Button, Icon, IconButton, SearchField, CourseCard, Card, Tag, Select } = window.WhizlabsDesignSystem_c8ccaf;

function TestsView({onNav}){
  return <div style={{padding:'26px 32px'}}>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:20}}>
      {['AWS','Microsoft Azure','Google Cloud','Kubernetes','Terraform'].map((t,i)=><Tag key={t} active={i===0}>{t}</Tag>)}
      <Select options={['Most popular','Newest','Highest rated']} size="sm" style={{width:170,marginLeft:'auto'}}/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}}>
      <CourseCard provider="AWS" kind="Practice Test" title="AWS Certified Solutions Architect – Associate (SAA-C03)" level="Associate" questions={780} rating={4.6} learners="128,400" badge="Enrolled" progress={38} onClick={()=>onNav('exam')}/>
      <CourseCard provider="AWS" kind="Practice Test" title="AWS Certified Developer – Associate (DVA-C02)" level="Associate" questions={620} rating={4.5} learners="74,100" price="$19.95"/>
      <CourseCard provider="Microsoft Azure" kind="Practice Test" title="Azure Solutions Architect Expert (AZ-305)" level="Expert" questions={410} rating={4.4} learners="31,800" price="$24.95" thumbColor="linear-gradient(135deg,#0f9d8f,#2563eb)"/>
      <CourseCard provider="Google Cloud" kind="Practice Test" title="Professional Cloud Architect" level="Professional" questions={540} rating={4.7} learners="41,300" price="$19.95"/>
      <CourseCard provider="Kubernetes" kind="Hands-On Lab" title="CKA: Cluster Troubleshooting Sandbox" level="Professional" hours="6 labs" rating={4.8} price="$29.95" thumbColor="linear-gradient(135deg,#131b2c,#33415c)"/>
      <CourseCard provider="Terraform" kind="Video Course" title="HashiCorp Certified: Terraform Associate" level="Associate" hours="12h" rating={4.7} learners="55,100" progress={72}/>
    </div>
  </div>;
}

function Placeholder({title}){
  return <div style={{padding:'80px 32px',textAlign:'center'}}>
    <div style={{font:'var(--type-h3)',color:'var(--ink-950)'}}>{title}</div>
    <p style={{font:'var(--type-body-sm)',color:'var(--text-muted)',marginTop:8}}>Left intentionally blank — no source design was provided for this surface.</p>
  </div>;
}

const TITLES={dash:['Good morning, Priya','Two tasks are due before your exam on 2 September.'],
 tests:['Practice tests','Everything in your Unlimited plan.'],
 exam:['AWS Solutions Architect – Associate','Attempt 3 · Full-length mock 2'],
 results:['Attempt 3 results','Submitted 7 August 2026 · 108 minutes'],
 labs:['Hands-on labs',null],certs:['Certificates',null]};

function App(){
  const [view,setView]=React.useState('dash');
  const t=TITLES[view]||['',null];
  const actions=view==='exam'
    ? <div style={{display:'flex',gap:10,alignItems:'center'}}><span style={{font:'var(--fw-semibold) var(--text-xl)/1 var(--font-mono)',color:'var(--orange-600)'}}>42:17</span><Button variant="secondary" onClick={()=>setView('results')}>Submit</Button></div>
    : <div style={{display:'flex',gap:10,alignItems:'center'}}><SearchField size="md" placeholder="Search your library" style={{width:250}}/><IconButton variant="ghost" label="Notifications"><Icon name="bell" size={19}/></IconButton></div>;
  return <AppShell view={view} onNav={setView}>
    <TopBar title={t[0]} subtitle={t[1]} actions={actions}/>
    {view==='dash'&&<Dashboard onNav={setView}/>}
    {view==='tests'&&<TestsView onNav={setView}/>}
    {view==='exam'&&<ExamPlayer onFinish={()=>setView('results')}/>}
    {view==='results'&&<ResultsView onNav={setView}/>}
    {(view==='labs'||view==='certs')&&<Placeholder title={t[0]}/>}
  </AppShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
