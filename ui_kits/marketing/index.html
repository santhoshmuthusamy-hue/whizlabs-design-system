</head><body><template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><rect width="120" height="80" fill="#f0602a"/><g transform="translate(30,26) scale(0.4)" fill="#fff"><path d="M28.12,28.06l-9.3-16.8c-1.2-2.1-3.4-3.4-5.8-3.4h-5.7c-.2,0-.5.2-.5.4v.3l12.6,22.8c1.1,2.1,3.3,3.4,5.8,3.4h6.5l-.9-1.6.9,1.6h4.6c.6,0,1-.4,1-.9s0-.4-.1-.6c-3.8,0-7.3-2-9.3-5.2h.2,0Z"/><path d="M47.52,28.06l-9.3-16.8c-1.1-2.1-3.4-3.4-5.8-3.4h-5.7c-.2,0-.5.2-.5.4v.3l12.6,22.8c1.1,2.1,3.3,3.4,5.8,3.4h6.5l-.8-1.6.9,1.6h4.6c.6,0,1-.4,1-.9s0-.4-.1-.6c-3.8,0-7.4-2-9.4-5.2h.2,0Z"/><path d="M48.42,13.76h0c.8,2.3,3.2,3.6,5.6,2.8,1.8-.6,3-2.3,3-4.2s-2-4.4-4.4-4.4h-8.4c-.5,0-.9.5-.9,1v.2c3.4,0,5,4.6,5,4.6h.1Z"/></g><text x="60" y="66" fill="#fff" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Marketing</text></svg></template>
<div id="root"></div>

<script type="text/babel" src="Hero.jsx"></script>

<script type="text/babel">
/* DS bundle guard */
if(!window.WhizlabsDesignSystem_c8ccaf){document.getElementById('root').innerHTML='<p style="font:14px/1.5 system-ui;padding:24px;color:#b23616">Design system bundle not loaded — _ds_bundle.js is generated by the compiler. Open this page from the project so <code>../../_ds_bundle.js</code> resolves.</p>';throw new Error('_ds_bundle.js missing');}
const { Button, Badge, Tag, Tabs, Breadcrumb, Pagination, Card, Icon, Select, LessonRow, ProgressBar, Avatar } = window.WhizlabsDesignSystem_c8ccaf;

function CatalogPage({onNav}){
  const [tab,setTab]=React.useState('all');const [page,setPage]=React.useState(1);
  const facets=['AWS','Microsoft Azure','Google Cloud','Kubernetes','Terraform','Docker','Python'];
  return <div className="sec" style={{paddingTop:40}}>
    <Breadcrumb items={[{label:'Home',href:'#'},{label:'Certifications'}]}/>
    <h1 className="h2" style={{marginTop:12}}>Certification catalog</h1>
    <p style={{font:'var(--type-body)',color:'var(--text-muted)',margin:'8px 0 26px',maxWidth:'62ch'}}>500+ exams across cloud, DevOps and data. Every bundle includes unlimited attempts and written explanations.</p>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:22}}>{facets.map((t,i)=><Tag key={t} active={i===0}>{t}</Tag>)}</div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:22}}>
      <Tabs items={[{value:'all',label:'All',count:512},{value:'test',label:'Practice tests',count:318},{value:'video',label:'Video courses',count:126},{value:'lab',label:'Hands-on labs',count:68}]} value={tab} onChange={setTab}/>
      <Select options={['Most popular','Newest','Highest rated']} size="sm" style={{width:180}}/>
    </div>
    <CatalogGrid onOpen={()=>onNav('course')}/>
    <div style={{display:'flex',justifyContent:'center',marginTop:34}}><Pagination page={page} pageCount={6} onChange={setPage}/></div>
  </div>;
}

function CoursePage({onNav}){
  const [tab,setTab]=React.useState('cur');
  return <div>
    <div style={{background:'var(--ink-950)',color:'#fff'}}>
      <div className="sec" style={{paddingTop:40,paddingBottom:44,display:'grid',gridTemplateColumns:'1.5fr .9fr',gap:48}}>
        <div>
          <Breadcrumb items={[{label:'Certifications',href:'#'},{label:'AWS',href:'#'},{label:'Solutions Architect – Associate'}]} style={{opacity:.75,filter:'invert(1) grayscale(1) contrast(2)'}}/>
          <h1 style={{font:'var(--fw-bold) 42px/1.1 var(--font-display)',letterSpacing:'var(--ls-tighter)',margin:'14px 0 0'}}>AWS Certified Solutions Architect – Associate (SAA-C03)</h1>
          <p style={{font:'var(--type-body)',color:'var(--ink-300)',margin:'14px 0 0',maxWidth:'60ch'}}>780 exam-style questions across all four domains, each with a written explanation and a reference to the AWS documentation.</p>
          <div style={{display:'flex',gap:8,marginTop:20,flexWrap:'wrap'}}>
            <Badge tone="brand" solid uppercase>Bestseller</Badge><Badge tone="inverse">Associate</Badge><Badge tone="inverse">Updated Jul 2026</Badge><Badge tone="inverse">780 questions</Badge>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:14,marginTop:22,font:'var(--type-body-sm)',color:'var(--ink-300)'}}>
            <span style={{color:'var(--brand-amber)',fontWeight:700}}>★ 4.6</span><span>1,840 ratings</span><span>·</span><span>128,400 learners</span>
          </div>
        </div>
        <Card padding="22px" style={{alignSelf:'start'}}>
          <div style={{height:110,borderRadius:'var(--radius-md)',background:'var(--brand-gradient)',display:'grid',placeItems:'center',marginBottom:18}}>
            <Icon name="play-circle" size={40} color="#fff"/>
          </div>
          <div style={{display:'flex',alignItems:'baseline',gap:10}}>
            <span style={{font:'var(--fw-bold) 34px/1 var(--font-display)',color:'var(--ink-950)'}}>$19.95</span>
            <span style={{font:'var(--type-body-sm)',color:'var(--text-muted)',textDecoration:'line-through'}}>$39.95</span>
          </div>
          <Button fullWidth size="lg" style={{marginTop:16}} onClick={()=>onNav('app')}>Enroll now</Button>
          <Button fullWidth size="lg" variant="secondary" style={{marginTop:10}}>Add to cart</Button>
          <div style={{marginTop:18,display:'flex',flexDirection:'column',gap:9}}>
            {[['infinity','Unlimited attempts'],['file-text','Explanation for every question'],['smartphone','Mobile and desktop'],['award','Certificate of completion']].map(([ic,t])=>
              <span key={t} style={{display:'flex',gap:9,alignItems:'center',font:'var(--type-body-sm)',color:'var(--ink-700)'}}><Icon name={ic} size={17} color="var(--orange-500)"/>{t}</span>)}
          </div>
        </Card>
      </div>
    </div>
    <div className="sec" style={{paddingTop:36,paddingBottom:72,display:'grid',gridTemplateColumns:'1.5fr .9fr',gap:48,alignItems:'start'}}>
      <div>
        <Tabs items={[{value:'ov',label:'Overview'},{value:'cur',label:'Curriculum',count:42},{value:'rev',label:'Reviews',count:1840}]} value={tab} onChange={setTab} style={{marginBottom:24}}/>
        {tab==='cur'&&<div style={{display:'flex',flexDirection:'column',gap:8}}>
          {[['Full-length mock 1','65 questions','130:00','done'],['Full-length mock 2','65 questions','130:00','current'],['Domain quiz: Resilient Architectures','20 questions','40:00','todo'],['Domain quiz: High-Performing Architectures','20 questions','40:00','todo'],['Domain quiz: Secure Applications','25 questions','50:00','todo']].map((r,i)=>
            <LessonRow key={i} index={i+1} title={r[0]} meta={r[1]} duration={r[2]} state={r[3]} onClick={()=>onNav('app')}/>)}
        </div>}
        {tab==='ov'&&<div style={{font:'var(--type-body)',color:'var(--text-body)',maxWidth:'66ch'}}>
          <p style={{marginTop:0}}>This bundle mirrors the live SAA-C03 exam: the same domain weighting, the same scenario length, the same distractor style. Sit a full-length mock under timed conditions, then read the explanation for every question you missed.</p>
          <h3 style={{font:'var(--type-h3)',color:'var(--ink-950)',marginBottom:8}}>What you will practise</h3>
          <ul style={{paddingLeft:20,margin:0}}><li>Designing resilient, multi-AZ architectures</li><li>Cost-optimised storage and compute choices</li><li>Identity, encryption and network isolation</li><li>Migration and hybrid connectivity patterns</li></ul>
        </div>}
        {tab==='rev'&&<div style={{display:'flex',flexDirection:'column',gap:14}}>
          {[['Priya Nair','Passed with 842. The mocks were harder than the real exam, which is exactly what you want.'],['Daniel Osei','Explanations link straight to the docs. That saved me a week.']].map(([n,t])=>
            <Card key={n} padding="18px"><div style={{display:'flex',gap:12}}><Avatar name={n} size={36}/><div><div style={{font:'var(--fw-semibold) var(--text-sm)/1 var(--font-display)',color:'var(--ink-950)'}}>{n}</div><div style={{color:'var(--brand-amber)',fontSize:13,margin:'4px 0'}}>★★★★★</div><div style={{font:'var(--type-body-sm)',color:'var(--text-body)'}}>{t}</div></div></div></Card>)}
        </div>}
      </div>
      <Card padding="22px">
        <div style={{font:'var(--type-h3)',color:'var(--ink-950)',marginBottom:14}}>Exam at a glance</div>
        {[['Exam code','SAA-C03'],['Questions','65'],['Duration','130 minutes'],['Passing score','720 / 1000'],['Cost','USD 150']].map(([k,v])=>
          <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid var(--border-subtle)',font:'var(--type-body-sm)'}}>
            <span style={{color:'var(--text-muted)'}}>{k}</span><span style={{color:'var(--ink-950)',fontFamily:'var(--font-mono)',fontWeight:600}}>{v}</span></div>)}
        <ProgressBar value={38} showLabel label="Your readiness" style={{marginTop:18}}/>
      </Card>
    </div>
  </div>;
}

function HomePage({onNav}){
  return <div>
    <Hero onNav={onNav}/>
    <ProofBand/>
    <div className="sec" style={{paddingTop:24}}>
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginBottom:28}}>
        <div><span className="eyebrow">Most enrolled</span><h2 className="h2">Start with the exam you are sitting</h2></div>
        <Button variant="outline" onClick={()=>onNav('catalog')} trailingIcon={<Icon name="arrow-right" size={17}/>}>View all 512</Button>
      </div>
      <CatalogGrid onOpen={()=>onNav('course')} limit={6}/>
    </div>
    <PricingSection onNav={onNav}/>
  </div>;
}

function App(){
  const [page,setPage]=React.useState('home');
  const nav=p=>{setPage(p);window.scrollTo(0,0)};
  return <div>
    <SiteHeader page={page} onNav={nav}/>
    {page==='home'&&<HomePage onNav={nav}/>}
    {page==='catalog'&&<CatalogPage onNav={nav}/>}
    {page==='course'&&<CoursePage onNav={nav}/>}
    {(page==='pricing'||page==='app')&&<PricingSection onNav={nav}/>}
    <SiteFooter/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
