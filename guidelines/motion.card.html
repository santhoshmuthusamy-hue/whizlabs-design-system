<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--white);color:var(--text-strong)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sw{border-radius:var(--radius-md);height:64px;display:flex;align-items:flex-end;padding:7px;font:var(--fw-semibold) 10px/1.2 var(--font-mono);color:#fff}.lbl{font:var(--fw-medium) 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:5px}.cell{flex:1;min-width:0}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font:13px/1.5 var(--font-body);color:var(--text-body)">
<div><b style="font-family:var(--font-display)">80 / 140 / 200 / 320 / 520ms</b> — instant, fast, base, slow, slower</div>
<div><b style="font-family:var(--font-display)">cubic-bezier(.2,.7,.3,1)</b> — the standard curve</div>
<div><b style="font-family:var(--font-display)">Hover</b> — cards lift −2px, shadow-sm → shadow-lg</div>
<div><b style="font-family:var(--font-display)">Press</b> — scale .97, no colour change</div>
</div>
<div class="lbl" style="margin-top:12px">No bounce, no spring, no parallax. Motion confirms an action; it never decorates.</div>
</body></html>
