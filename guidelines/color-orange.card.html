<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--white);color:var(--text-strong)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sw{border-radius:var(--radius-md);height:64px;display:flex;align-items:flex-end;padding:7px;font:var(--fw-semibold) 10px/1.2 var(--font-mono);color:#fff}.lbl{font:var(--fw-medium) 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:5px}.cell{flex:1;min-width:0}</style></head><body>
<div class="row" style="gap:10px;flex-wrap:nowrap">
<div class="cell"><div class="sw" style="background:var(--orange-50);color:var(--ink-800)">50</div></div><div class="cell"><div class="sw" style="background:var(--orange-100);color:var(--ink-800)">100</div></div><div class="cell"><div class="sw" style="background:var(--orange-200);color:var(--ink-800)">200</div></div><div class="cell"><div class="sw" style="background:var(--orange-300);color:var(--ink-800)">300</div></div><div class="cell"><div class="sw" style="background:var(--orange-400);">400</div></div><div class="cell"><div class="sw" style="background:var(--orange-500);">500</div></div><div class="cell"><div class="sw" style="background:var(--orange-600);">600</div></div><div class="cell"><div class="sw" style="background:var(--orange-700);">700</div></div><div class="cell"><div class="sw" style="background:var(--orange-800);">800</div></div><div class="cell"><div class="sw" style="background:var(--orange-900);">900</div></div>
</div><div class="lbl" style="margin-top:10px">500 is the primary action colour; 600 for hover and link text; 50 for selected rows.</div>
</body></html>
