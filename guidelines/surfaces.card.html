<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--white);color:var(--text-strong)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sw{border-radius:var(--radius-md);height:64px;display:flex;align-items:flex-end;padding:7px;font:var(--fw-semibold) 10px/1.2 var(--font-mono);color:#fff}.lbl{font:var(--fw-medium) 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:5px}.cell{flex:1;min-width:0}</style></head><body style="background:var(--ink-50)">
<div class="row" style="flex-wrap:nowrap;gap:16px;align-items:stretch">
<div style="flex:1;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:18px"><div style="font:700 15px/1.3 var(--font-display);color:var(--text-strong)">Resting</div><div style="font:13px/1.5 var(--font-body);color:var(--text-muted);margin-top:4px">1px ink-100 · r14 · shadow-sm</div></div>
<div style="flex:1;background:#fff;border:1px solid var(--ink-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:18px;transform:translateY(-2px)"><div style="font:700 15px/1.3 var(--font-display);color:var(--text-strong)">Hover</div><div style="font:13px/1.5 var(--font-body);color:var(--text-muted);margin-top:4px">lift −2px · shadow-lg</div></div>
<div style="flex:1;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:18px;position:relative;overflow:hidden"><span style="position:absolute;inset:0 0 auto 0;height:4px;background:var(--brand-gradient)"></span><div style="font:700 15px/1.3 var(--font-display);color:var(--text-strong)">Accented</div><div style="font:13px/1.5 var(--font-body);color:var(--text-muted);margin-top:4px">4px gradient top rule</div></div>
</div></body></html>
