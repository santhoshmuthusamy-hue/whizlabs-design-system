<!-- @dsCard group="Brand" viewport="700x160" name="Gradient usage" subtitle="Where the brand gradient is allowed" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--white);color:var(--text-strong)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sw{border-radius:var(--radius-md);height:64px;display:flex;align-items:flex-end;padding:7px;font:var(--fw-semibold) 10px/1.2 var(--font-mono);color:#fff}.lbl{font:var(--fw-medium) 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:5px}.cell{flex:1;min-width:0}</style></head><body>
<div class="row" style="flex-wrap:nowrap;gap:12px">
<div style="flex:1;height:44px;border-radius:var(--radius-md);background:var(--brand-gradient);display:grid;place-items:center;font:600 13px/1 var(--font-display);color:#fff">Primary button</div>
<div style="flex:1;height:44px;border-radius:var(--radius-md);background:var(--brand-gradient-soft);border:1px solid var(--orange-100);display:grid;place-items:center;font:600 13px/1 var(--font-display);color:var(--orange-700)">Soft section band</div>
<div style="flex:1;height:44px;border-radius:var(--radius-md);background:var(--ink-950);display:grid;place-items:center;position:relative;overflow:hidden"><span style="position:absolute;inset:auto 0 0 0;height:4px;background:var(--brand-gradient)"></span><span style="font:600 13px/1 var(--font-display);color:#fff">Ink + gradient rule</span></div>
</div>
<div class="lbl" style="margin-top:12px">Allowed: primary buttons, 4px accent rules, thumbnail bands, progress fills, checked controls. Never as a full-page background.</div>
</body></html>
