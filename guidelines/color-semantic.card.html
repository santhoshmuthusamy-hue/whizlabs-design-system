<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--white);color:var(--text-strong)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sw{border-radius:var(--radius-md);height:64px;display:flex;align-items:flex-end;padding:7px;font:var(--fw-semibold) 10px/1.2 var(--font-mono);color:#fff}.lbl{font:var(--fw-medium) 11px/1.3 var(--font-mono);color:var(--text-muted);margin-top:5px}.cell{flex:1;min-width:0}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:9px 10px"><div style="width:100%;height:18px;border-radius:4px;background:var(--text-strong);border:1px solid var(--border-subtle)"></div><div style="font:var(--fw-semibold) 10px/1.3 var(--font-mono);color:var(--text-strong);margin-top:6px">--text-strong</div><div style="font:11px/1.3 var(--font-body);color:var(--text-muted)">Headings</div></div><div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:9px 10px"><div style="width:100%;height:18px;border-radius:4px;background:var(--text-body);border:1px solid var(--border-subtle)"></div><div style="font:var(--fw-semibold) 10px/1.3 var(--font-mono);color:var(--text-strong);margin-top:6px">--text-body</div><div style="font:11px/1.3 var(--font-body);color:var(--text-muted)">Body copy</div></div><div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:9px 10px"><div style="width:100%;height:18px;border-radius:4px;background:var(--text-muted);border:1px solid var(--border-subtle)"></div><div style="font:var(--fw-semibold) 10px/1.3 var(--font-mono);color:var(--text-strong);margin-top:6px">--text-muted</div><div style="font:11px/1.3 var(--font-body);color:var(--text-muted)">Meta / captions</div></div><div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:9px 10px"><div style="width:100%;height:18px;border-radius:4px;background:var(--text-link);border:1px solid var(--border-subtle)"></div><div style="font:var(--fw-semibold) 10px/1.3 var(--font-mono);color:var(--text-strong);margin-top:6px">--text-link</div><div style="font:11px/1.3 var(--font-body);color:var(--text-muted)">Links</div></div><div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:9px 10px"><div style="width:100%;height:18px;border-radius:4px;background:var(--surface-page);border:1px solid var(--border-subtle)"></div><div style="font:var(--fw-semibold) 10px/1.3 var(--font-mono);color:var(--text-strong);margin-top:6px">--surface-page</div><div style="font:11px/1.3 var(--font-body);color:var(--text-muted)">Page</div></div><div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:9px 10px"><div style="width:100%;height:18px;border-radius:4px;background:var(--surface-subtle);border:1px solid var(--border-subtle)"></div><div style="font:var(--fw-semibold) 10px/1.3 var(--font-mono);color:var(--text-strong);margin-top:6px">--surface-subtle</div><div style="font:11px/1.3 var(--font-body);color:var(--text-muted)">Section bands</div></div><div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:9px 10px"><div style="width:100%;height:18px;border-radius:4px;background:var(--surface-brand-subtle);border:1px solid var(--border-subtle)"></div><div style="font:var(--fw-semibold) 10px/1.3 var(--font-mono);color:var(--text-strong);margin-top:6px">--surface-brand-subtle</div><div style="font:11px/1.3 var(--font-body);color:var(--text-muted)">Selected</div></div><div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:9px 10px"><div style="width:100%;height:18px;border-radius:4px;background:var(--border-default);border:1px solid var(--border-subtle)"></div><div style="font:var(--fw-semibold) 10px/1.3 var(--font-mono);color:var(--text-strong);margin-top:6px">--border-default</div><div style="font:11px/1.3 var(--font-body);color:var(--text-muted)">Control borders</div></div>
